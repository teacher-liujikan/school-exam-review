/* 國字一律用符合教育部標準字體的「字嗨注音標楷」（不顯示注音版） */
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.school{font-size:14px;color:var(--muted);letter-spacing:.05em}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.lead{margin:0 0 22px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.grade{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grade h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.grade a{display:block;text-decoration:none;color:var(--pen);background:var(--pen-soft);border:1.5px solid var(--pen);border-radius:10px;padding:6px 12px}
.grade a:hover,.grade a:focus-visible{background:var(--card);outline:none}
.grade .none{color:var(--muted);font-size:15px}
footer{margin-top:36px;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="school">臺南市善化區陽明國小・115 學年度第一學期</div>
  <h1>考卷檢討</h1>
  <p class="lead">選自己的年級和考卷，拿著老師改好的考卷，一大題一大題自己檢討。</p>
  <div class="grades" id="grades"></div>
  <footer>每份考卷的作答紀錄只存在這台裝置的瀏覽器裡。</footer>
</div>
<script>
const EXAMS={
  '一年級':[],
  '二年級':[{name:'國語 期中評量',url:'g2/chinese-mid1/'},{name:'數學 期中評量',url:'g2/math-mid1/'}],
  '三年級':[],'四年級':[],'五年級':[],'六年級':[]
};
document.getElementById('grades').innerHTML=Object.entries(EXAMS).map(([g,list])=>
  `<section class="grade"><h2>${g}</h2>${list.length?list.map(e=>`<a href="${e.url}">${e.name}</a>`).join(''):'<span class="none">還沒有考卷</span>'}</section>`).join('');
</script>
</body>
</html>
